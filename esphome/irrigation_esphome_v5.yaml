# ============================================================
#  3-ZONE AUTOMATIC IRRIGATION SYSTEM
#  ESPHome Configuration — Rev 5.0
# ============================================================
#  Hardware:
#    Controller  : ESP32 DevKit V1 30-pin (WROOM-32)
#    Terminal    : ESP32 30-pin terminal adapter board
#    Display     : 0.96" SSD1306 I2C OLED 128x64 (enclosure lid)
#    Nextion     : NX4832F035 3.5" HMI (remote display box)
#    Pump        : 12V DC diaphragm pump (GPIO 15)
#    Solenoids   : 12V DC NC brass valves (GPIO 26/27/14)
#    Relay board : Keenso 4-ch 5V optoisolated (SRD-05VDC-SL-C)
#  Moisture      : Zigbee sensors via Z2M → HA
#
#  NETWORK:
#    Static IP   : 192.168.1.121
#
#  GPIO ASSIGNMENTS:
#    GPIO 4  : Nextion TX (UART)
#    GPIO 5  : Nextion RX (UART)
#    GPIO 14 : Zone 3 relay output
#    GPIO 15 : Pump relay output
#    GPIO 21 : OLED SDA (I2C)
#    GPIO 22 : OLED SCL (I2C)
#    GPIO 26 : Zone 1 relay output
#    GPIO 27 : Zone 2 relay output
#
#  NEXTION PICTURE INDEX MAP (must match import order in Editor):
#    0   nav_home.png
#    1   nav_zones.png
#    2   nav_moisture.png
#    3   nav_butt.png
#    4   nav_settings.png
#    5   nav_diag.png
#    6   valve_open.png
#    7   valve_closed.png
#    8   valve_disabled.png
#    9   pump_anim_0.png      ← animation frame 0 (48x48)
#    10  pump_anim_1.png      ← animation frame 1
#    11  pump_anim_2.png      ← animation frame 2
#    12  pump_anim_3.png      ← animation frame 3
#    13  pump_anim_4.png      ← animation frame 4
#    14  pump_anim_5.png      ← animation frame 5
#    15  pump_stopped.png     ← static stopped state (48x48)
#    16  pump_running.png     ← unused (replaced by animation)
#    17  water_drop_empty.png
#    18  weather_sun.png
#    19  weather_cloud.png
#    20  weather_rain.png
#    21  weather_snow.png
#    22  weather_frost.png
#    23  battery_full.png
#    24  battery_high.png
#    25  battery_low.png
#    26  battery_empty.png
#    27  tick.png
#    28  cross.png
#    29  warning.png
#    30  wifi_excellent.png
#    31  wifi_good.png
#    32  wifi_fair.png
#    33  wifi_poor.png
#    34  water_drop_anim_0.png
#    35  water_drop_anim_1.png
#    36  water_drop_anim_2.png
#    37  valve_flow_anim_0.png
#    38  valve_flow_anim_1.png
#    39  valve_flow_anim_2.png
#    40  bg_p0 (pid_background.png)
#    41  bg_p1.png
#    42  bg_p2.png
#    43  bg_p3.png
#    44  bg_p4.png
#    45  bg_p5.png
#    46  battery_sm_full.png
#    47  battery_sm_high.png
#    48  battery_sm_low.png
#    49  battery_sm_empty.png
#
#  CHANGE LOG:
#    Rev 1.0 — Initial release
#    Rev 2.0 — Added OLED display
#    Rev 3.0 — Zigbee moisture sensors via HA
#    Rev 4.0 — Added Nextion 3.5" HMI remote display
#    Rev 4.1 — Fixed Nextion pins GPIO4/5, IP 192.168.1.121
#    Rev 5.0 — Merged animation YAML: pump spin (48x48), valve flow,
#              water drop pulse. Fixed all component names (p_pump,
#              p_v1/v2/v3). Added valve state icon management.
# ============================================================

esphome:
  name: irrigation-controller
  friendly_name: Garden Irrigation Controller
  comment: "3-zone irrigation — back garden + 2x front garden"
  on_boot:
    priority: -100
    then:
      - switch.turn_off: zone1_valve
      - switch.turn_off: zone2_valve
      - switch.turn_off: zone3_valve
      - switch.turn_off: pump_relay
      - logger.log: "Irrigation controller booted — all valves closed"
      - component.update: oled_display
      - delay: 3s
      - lambda: |-
          id(nextion_display).send_command("page 0");
          // Initialise all icons to safe defaults
          id(nextion_display).set_component_picture("p0.p_pump", 15);   // pump_stopped
          id(nextion_display).set_component_picture("p0.p_v1", 7);      // valve_closed
          id(nextion_display).set_component_picture("p0.p_v2", 7);      // valve_closed
          id(nextion_display).set_component_picture("p0.p_v3", 7);      // valve_closed
          id(nextion_display).set_component_picture("p0.p_drop", 17);   // water_drop_empty

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  services:
    - service: start_zone
      variables:
        zone: int
        duration_minutes: int
      then:
        - script.execute:
            id: run_zone
            zone: !lambda "return zone;"
            duration_minutes: !lambda "return duration_minutes;"
    - service: stop_all
      then:
        - script.execute: emergency_stop
    - service: moisture_trigger
      variables:
        zone: int
      then:
        - if:
            condition:
              lambda: "return id(active_zone) == 0;"
            then:
              - script.execute:
                  id: run_zone
                  zone: !lambda "return zone;"
                  duration_minutes: 8

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.121
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  ap:
    ssid: "Irrigation Fallback"
    password: !secret ap_fallback_password

captive_portal:

web_server:
  port: 80

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: bus_a

uart:
  id: uart_nextion
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 9600

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto"
    id: font_medium
    size: 12

# ============================================================
#  GLOBALS — animation frame counters + zone disable flags
# ============================================================
globals:
  - id: active_zone
    type: int
    restore_value: no
    initial_value: "0"
  - id: pump_frame
    type: int
    restore_value: no
    initial_value: "0"
  - id: drop_frame
    type: int
    restore_value: no
    initial_value: "0"
  - id: valve_frame
    type: int
    restore_value: no
    initial_value: "0"
  - id: zone1_enabled
    type: bool
    restore_value: yes
    initial_value: "true"
  - id: zone2_enabled
    type: bool
    restore_value: yes
    initial_value: "true"
  - id: zone3_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

# ============================================================
#  INTERVALS
# ============================================================
interval:
  # ── 100ms: Nextion animations ──────────────────────────────
  - interval: 100ms
    then:
      - lambda: |-
          // ── Pump animation ───────────────────────────────
          // Running: cycle frames 9-14 (pump_anim_0 to pump_anim_5, 48x48)
          // Stopped: frame 15 (pump_stopped, 48x48)
          if (id(pump_relay).state) {
            id(pump_frame) = (id(pump_frame) + 1) % 6;
            id(nextion_display).set_component_picture("p0.p_pump", 9 + id(pump_frame));
          } else {
            if (id(pump_frame) != -1) {
              id(pump_frame) = -1;
              id(nextion_display).set_component_picture("p0.p_pump", 15);
            }
          }

          // ── Water drop pulse on main supply pipe ─────────
          // Active: cycle frames 34-36 (water_drop_anim_0/1/2)
          // Idle:   frame 17 (water_drop_empty)
          bool any_active = id(zone1_valve).state ||
                            id(zone2_valve).state ||
                            id(zone3_valve).state;
          if (any_active) {
            id(drop_frame) = (id(drop_frame) + 1) % 3;
            id(nextion_display).set_component_picture("p0.p_drop", 34 + id(drop_frame));
          } else {
            id(nextion_display).set_component_picture("p0.p_drop", 17);
          }

          // ── Valve flow animations ─────────────────────────
          // Open+active: cycle frames 37-39 (valve_flow_anim_0/1/2)
          // Open (no flow): frame 6 (valve_open, static)
          // Closed:         frame 7 (valve_closed)
          // Disabled:       frame 8 (valve_disabled)
          if (id(zone1_valve).state) {
            id(valve_frame) = (id(valve_frame) + 1) % 3;
            id(nextion_display).set_component_picture("p0.p_v1", 37 + id(valve_frame));
          }
          if (id(zone2_valve).state) {
            id(nextion_display).set_component_picture("p0.p_v2", 37 + id(valve_frame));
          }
          if (id(zone3_valve).state) {
            id(nextion_display).set_component_picture("p0.p_v3", 37 + id(valve_frame));
          }

  # ── 1s: Clock, moisture, status text ──────────────────────
  - interval: 1s
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            char time_buf[9];
            sprintf(time_buf, "%02d:%02d:%02d", now.hour, now.minute, now.second);
            id(nextion_display).set_component_text("p0.t_time", time_buf);
            char date_buf[18];
            const char* days[]   = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
            const char* months[] = {"","Jan","Feb","Mar","Apr","May","Jun",
                                    "Jul","Aug","Sep","Oct","Nov","Dec"};
            sprintf(date_buf, "%s %02d %s %04d",
                    days[now.day_of_week], now.day_of_month,
                    months[now.month], now.year);
            id(nextion_display).set_component_text("p0.t_date", date_buf);
          }
          // Status bar
          id(nextion_display).set_component_text("p0.t_status",
            id(active_zone) != 0 ? "WATERING ACTIVE" : "SYSTEM READY");
          id(nextion_display).set_component_text("p0.t_pump_st",
            id(pump_relay).state ? "RUNNING" : "STANDBY");

# ============================================================
#  DISPLAYS
# ============================================================
display:
  # ── OLED (enclosure lid, 128x64) ──────────────────────────
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled_display
    update_interval: 5s
    lambda: |-
      if (id(active_zone) != 0) {
        it.fill(COLOR_OFF);
        it.printf(64, 2, id(font_small), COLOR_ON, TextAlign::TOP_CENTER, "WATERING ACTIVE");
        it.printf(64, 18, id(font_medium), COLOR_ON, TextAlign::TOP_CENTER, "%s",
                  id(active_zone_name).state.c_str());
        it.printf(0, 34, id(font_small), COLOR_ON, TextAlign::TOP_LEFT, "Pump: %s",
                  id(pump_relay).state ? "ON" : "OFF");
      } else {
        it.fill(COLOR_OFF);
        it.printf(0, 4, id(font_small), COLOR_ON, TextAlign::TOP_LEFT, "Z1");
        float z1 = id(ha_moisture_z1).state;
        if (!isnan(z1)) {
          it.rectangle(18, 5, 90, 9);
          it.filled_rectangle(18, 5, (int)(z1 * 0.9), 9);
          it.printf(112, 4, id(font_small), COLOR_ON, TextAlign::TOP_LEFT, "%.0f%%", z1);
        } else {
          it.printf(18, 4, id(font_small), COLOR_ON, TextAlign::TOP_LEFT, "No sensor");
        }
        it.printf(0, 18, id(font_small), COLOR_ON, TextAlign::TOP_LEFT, "Z2");
        float z2 = id(ha_moisture_z2).state;
        if (!isnan(z2)) {
          it.rectangle(18, 19, 90, 9);
          it.filled_rectangle(18, 19, (int)(z2 * 0.9), 9);
          it.printf(112, 18, id(font_small), COLOR_ON, TextAlign::TOP_LEFT, "%.0f%%", z2);
        } else {
          it.printf(18, 18, id(font_small), COLOR_ON, TextAlign::TOP_LEFT, "No sensor");
        }
        it.printf(0, 32, id(font_small), COLOR_ON, TextAlign::TOP_LEFT, "Z3");
        it.printf(18, 32, id(font_small), COLOR_ON, TextAlign::TOP_LEFT, "Schedule only");
        it.line(0, 44, 128, 44);
        it.printf(64, 46, id(font_small), COLOR_ON, TextAlign::TOP_CENTER, "HA Connected");
      }

  # ── Nextion 3.5" HMI (5s refresh for data; animations on 100ms interval) ──
  - platform: nextion
    id: nextion_display
    uart_id: uart_nextion
    update_interval: 5s
    lambda: |-
      float z1 = id(ha_moisture_z1).state;
      float z2 = id(ha_moisture_z2).state;
      char buf[16];

      // ── p0: P&ID home page ─────────────────────────────
      id(nextion_display).set_component_text("p0.t_status",
        id(active_zone) != 0 ? "WATERING ACTIVE" : "SYSTEM READY");

      // ── p1: Zones page ────────────────────────────────
      if (!isnan(z1)) {
        sprintf(buf, "%.0f%%", z1);
        id(nextion_display).set_component_text("p1.t_z1_mois", buf);
        id(nextion_display).set_component_value("p1.j0", (int)z1);
        id(nextion_display).set_component_text("p1.t_z1_status",
          z1 < 30 ? "DRY" : z1 < 60 ? "OK" : "WET");
      } else {
        id(nextion_display).set_component_text("p1.t_z1_mois", "N/A");
        id(nextion_display).set_component_text("p1.t_z1_status", "NO SENSOR");
      }
      if (!isnan(z2)) {
        sprintf(buf, "%.0f%%", z2);
        id(nextion_display).set_component_text("p1.t_z2_mois", buf);
        id(nextion_display).set_component_value("p1.j1", (int)z2);
        id(nextion_display).set_component_text("p1.t_z2_status",
          z2 < 30 ? "DRY" : z2 < 60 ? "OK" : "WET");
      } else {
        id(nextion_display).set_component_text("p1.t_z2_mois", "N/A");
        id(nextion_display).set_component_text("p1.t_z2_status", "NO SENSOR");
      }
      id(nextion_display).set_component_text("p1.t_z3_status", "SCHEDULE ONLY");

      // Valve text labels on zones page
      sprintf(buf, "%s", id(zone1_valve).state ? "OPEN" : "CLOSED");
      id(nextion_display).set_component_text("p1.t_z1_valve", buf);
      sprintf(buf, "%s", id(zone2_valve).state ? "OPEN" : "CLOSED");
      id(nextion_display).set_component_text("p1.t_z2_valve", buf);
      sprintf(buf, "%s", id(zone3_valve).state ? "OPEN" : "CLOSED");
      id(nextion_display).set_component_text("p1.t_z3_valve", buf);

      // ── p2: Moisture page ─────────────────────────────
      if (!isnan(z1)) {
        sprintf(buf, "%.0f%%", z1);
        id(nextion_display).set_component_text("p2.t_z1_pct", buf);
        id(nextion_display).set_component_value("p2.j0", (int)z1);
        id(nextion_display).set_component_text("p2.t_z1_status",
          z1 < 25 ? "DRY" : z1 < 55 ? "OK" : z1 < 80 ? "WET" : "SATURATED");
      }
      if (!isnan(z2)) {
        sprintf(buf, "%.0f%%", z2);
        id(nextion_display).set_component_text("p2.t_z2_pct", buf);
        id(nextion_display).set_component_value("p2.j1", (int)z2);
        id(nextion_display).set_component_text("p2.t_z2_status",
          z2 < 25 ? "DRY" : z2 < 55 ? "OK" : z2 < 80 ? "WET" : "SATURATED");
      }

      // ── p4: Settings page ─────────────────────────────
      // Thresholds and durations
      char thresh1[8], thresh2[8], dur1[8], dur2[8], dur3[8];
      sprintf(thresh1, "%.0f%%", id(ha_threshold_z1).state);
      sprintf(thresh2, "%.0f%%", id(ha_threshold_z2).state);
      sprintf(dur1, "%.0fmin", id(ha_duration_z1).state);
      sprintf(dur2, "%.0fmin", id(ha_duration_z2).state);
      sprintf(dur3, "%.0fmin", id(ha_duration_z3).state);
      id(nextion_display).set_component_text("p4.t_thresh1", thresh1);
      id(nextion_display).set_component_text("p4.t_thresh2", thresh2);
      id(nextion_display).set_component_text("p4.t_dur1", dur1);
      id(nextion_display).set_component_text("p4.t_dur2", dur2);
      id(nextion_display).set_component_text("p4.t_dur3", dur3);
      // Zone enable/disable: tick=27, cross=28
      id(nextion_display).set_component_picture("p4.p_z1en",
        id(zone1_enabled) ? 27 : 28);
      id(nextion_display).set_component_picture("p4.p_z2en",
        id(zone2_enabled) ? 27 : 28);
      id(nextion_display).set_component_picture("p4.p_z3en",
        id(zone3_enabled) ? 27 : 28);

      // ── p5: Diagnostics page ──────────────────────────
      int rssi = (int)id(wifi_signal_sensor).state;
      id(nextion_display).set_component_text("p5.t_wifi_db",
        rssi > -50 ? "Excellent" :
        rssi > -60 ? "Good" :
        rssi > -70 ? "Fair" : "Poor");
      // WiFi icon: excellent=30, good=31, fair=32, poor=33
      id(nextion_display).set_component_picture("p5.p_wifi",
        rssi > -50 ? 30 : rssi > -60 ? 31 : rssi > -70 ? 32 : 33);
      // Sensor status
      id(nextion_display).set_component_text("p5.t_z1_sns",
        !isnan(z1) ? "ONLINE" : "OFFLINE");
      id(nextion_display).set_component_text("p5.t_z2_sns",
        !isnan(z2) ? "ONLINE" : "OFFLINE");
      // Warning icon: show if any sensor offline
      id(nextion_display).set_component_picture("p5.p_warn",
        (!isnan(z1) && !isnan(z2)) ? 0 : 29);  // 0=hidden, 29=warning

# ============================================================
#  SENSORS
# ============================================================
sensor:
  - platform: homeassistant
    id: ha_moisture_z1
    entity_id: sensor.garden_moisture_sensor_back_soil_moisture
    name: "Z1 Moisture (from HA)"
    unit_of_measurement: "%"
    icon: mdi:water-percent
    on_value:
      then:
        - component.update: oled_display

  - platform: homeassistant
    id: ha_moisture_z2
    entity_id: sensor.garden_moisture_sensor_front_soil_moisture
    name: "Z2 Moisture (from HA)"
    unit_of_measurement: "%"
    icon: mdi:water-percent
    on_value:
      then:
        - component.update: oled_display

  - platform: homeassistant
    id: ha_threshold_z1
    entity_id: input_number.moisture_threshold_z1
    internal: true

  - platform: homeassistant
    id: ha_threshold_z2
    entity_id: input_number.moisture_threshold_z2
    internal: true

  - platform: homeassistant
    id: ha_duration_z1
    entity_id: input_number.zone_1_duration
    internal: true

  - platform: homeassistant
    id: ha_duration_z2
    entity_id: input_number.zone_2_duration
    internal: true

  - platform: homeassistant
    id: ha_duration_z3
    entity_id: input_number.zone_3_duration
    internal: true

  - platform: wifi_signal
    id: wifi_signal_sensor
    name: "Irrigation Controller WiFi"
    update_interval: 60s

  - platform: uptime
    name: "Irrigation Controller Uptime"
    update_interval: 60s

# ============================================================
#  TIME
# ============================================================
time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time

# ============================================================
#  OUTPUT & SWITCH
# ============================================================
output:
  - platform: gpio
    id: relay_zone1
    pin:
      number: GPIO26
      inverted: false
  - platform: gpio
    id: relay_zone2
    pin:
      number: GPIO27
      inverted: false
  - platform: gpio
    id: relay_zone3
    pin:
      number: GPIO14
      inverted: false
  - platform: gpio
    id: relay_pump
    pin:
      number: GPIO15
      inverted: false

switch:
  - platform: output
    id: zone1_valve
    name: "Zone 1 Valve (Back Garden)"
    output: relay_zone1
    restore_mode: ALWAYS_OFF
    icon: mdi:valve
    on_turn_on:
      then:
        - logger.log: "Zone 1 valve OPEN"
        - component.update: oled_display
        - lambda: |-
            id(nextion_display).set_component_picture("p0.p_v1", 6);  // valve_open
    on_turn_off:
      then:
        - logger.log: "Zone 1 valve CLOSED"
        - component.update: oled_display
        - lambda: |-
            id(nextion_display).set_component_picture("p0.p_v1", 7);  // valve_closed

  - platform: output
    id: zone2_valve
    name: "Zone 2 Valve (Front Garden A)"
    output: relay_zone2
    restore_mode: ALWAYS_OFF
    icon: mdi:valve
    on_turn_on:
      then:
        - logger.log: "Zone 2 valve OPEN"
        - component.update: oled_display
        - lambda: |-
            id(nextion_display).set_component_picture("p0.p_v2", 6);  // valve_open
    on_turn_off:
      then:
        - logger.log: "Zone 2 valve CLOSED"
        - component.update: oled_display
        - lambda: |-
            id(nextion_display).set_component_picture("p0.p_v2", 7);  // valve_closed

  - platform: output
    id: zone3_valve
    name: "Zone 3 Valve (Front Garden B)"
    output: relay_zone3
    restore_mode: ALWAYS_OFF
    icon: mdi:valve
    on_turn_on:
      then:
        - logger.log: "Zone 3 valve OPEN"
        - component.update: oled_display
        - lambda: |-
            id(nextion_display).set_component_picture("p0.p_v3", 6);  // valve_open
    on_turn_off:
      then:
        - logger.log: "Zone 3 valve CLOSED"
        - component.update: oled_display
        - lambda: |-
            id(nextion_display).set_component_picture("p0.p_v3", 7);  // valve_closed

  - platform: output
    id: pump_relay
    name: "Irrigation Pump"
    output: relay_pump
    restore_mode: ALWAYS_OFF
    icon: mdi:pump
    on_turn_on:
      then:
        - component.update: oled_display
        # Animation takes over immediately via 100ms interval
    on_turn_off:
      then:
        - component.update: oled_display
        - lambda: |-
            // Reset pump to stopped icon immediately, don't wait for interval
            id(pump_frame) = -1;
            id(nextion_display).set_component_picture("p0.p_pump", 15);  // pump_stopped

# ============================================================
#  BINARY SENSORS & TEXT SENSORS
# ============================================================
binary_sensor:
  - platform: template
    id: irrigation_active
    name: "Irrigation Active"
    icon: mdi:sprinkler
    lambda: |-
      return id(active_zone) != 0;
  - platform: status
    name: "Irrigation Controller Status"
    id: wifi_connected

text_sensor:
  - platform: template
    id: active_zone_name
    name: "Active Zone"
    icon: mdi:map-marker
    lambda: |-
      switch(id(active_zone)) {
        case 1: return {"Zone 1 Back Garden"};
        case 2: return {"Zone 2 Front A"};
        case 3: return {"Zone 3 Front B"};
        default: return {"Idle"};
      }
    update_interval: 5s
  - platform: wifi_info
    ip_address:
      name: "Irrigation IP Address"

# ============================================================
#  SCRIPTS
# ============================================================
script:
  - id: run_zone
    mode: single
    parameters:
      zone: int
      duration_minutes: int
    then:
      - if:
          condition:
            lambda: "return id(active_zone) != 0;"
          then:
            - logger.log:
                format: "Zone %d requested but zone %d already active"
                args: ["zone", "id(active_zone)"]
          else:
            - globals.set:
                id: active_zone
                value: !lambda "return zone;"
            - component.update: oled_display
            - lambda: id(nextion_display).send_command("page 0");
            - switch.turn_on: pump_relay
            - delay: 2000ms
            - if:
                condition:
                  lambda: "return zone == 1;"
                then:
                  - switch.turn_on: zone1_valve
            - if:
                condition:
                  lambda: "return zone == 2;"
                then:
                  - switch.turn_on: zone2_valve
            - if:
                condition:
                  lambda: "return zone == 3;"
                then:
                  - switch.turn_on: zone3_valve
            - delay: !lambda "return duration_minutes * 60000;"
            - script.execute:
                id: close_zone
                zone: !lambda "return zone;"

  - id: close_zone
    parameters:
      zone: int
    then:
      - if:
          condition:
            lambda: "return zone == 1;"
          then:
            - switch.turn_off: zone1_valve
      - if:
          condition:
            lambda: "return zone == 2;"
          then:
            - switch.turn_off: zone2_valve
      - if:
          condition:
            lambda: "return zone == 3;"
          then:
            - switch.turn_off: zone3_valve
      - delay: 3000ms
      - switch.turn_off: pump_relay
      - globals.set:
          id: active_zone
          value: "0"
      - component.update: oled_display
      - component.update: nextion_display
      - logger.log:
          format: "Zone %d complete — pump off"
          args: ["zone"]

  - id: emergency_stop
    mode: restart
    then:
      - switch.turn_off: zone1_valve
      - switch.turn_off: zone2_valve
      - switch.turn_off: zone3_valve
      - delay: 500ms
      - switch.turn_off: pump_relay
      - globals.set:
          id: active_zone
          value: "0"
      - component.update: oled_display
      - component.update: nextion_display
      - lambda: |-
          // Reset all icons to safe state
          id(nextion_display).set_component_picture("p0.p_pump", 15);  // pump_stopped
          id(nextion_display).set_component_picture("p0.p_v1", 7);     // valve_closed
          id(nextion_display).set_component_picture("p0.p_v2", 7);     // valve_closed
          id(nextion_display).set_component_picture("p0.p_v3", 7);     // valve_closed
          id(nextion_display).set_component_picture("p0.p_drop", 17);  // water_drop_empty
      - logger.log: "EMERGENCY STOP — all zones closed, icons reset"
      - homeassistant.event:
          event: esphome.irrigation_emergency_stop
          data: {}

# ============================================================
#  BUTTONS
# ============================================================
button:
  - platform: restart
    name: "Restart Irrigation Controller"
    icon: mdi:restart
  - platform: template
    name: "Emergency Stop"
    icon: mdi:stop-circle
    on_press:
      then:
        - script.execute: emergency_stop
